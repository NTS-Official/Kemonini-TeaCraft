license="${mod_license}"
# issueTrackerURL="https://change.me.to.your.issue.tracker.example.invalid/"
[[mods]]
modId="${mod_id}"
version="${mod_version}"

# A display name for the mod
displayName="${mod_name}" #mandatory

# A URL to query for updates for this mod. See the JSON update specification https://docs.neoforged.net/docs/misc/updatechecker/
#updateJSONURL="https://change.me.example.invalid/updates.json" #optional

# A URL for the "homepage" for this mod, displayed in the mod UI
#displayURL="https://change.me.to.your.mods.homepage.example.invalid/" #optional

# A file name (in the root of the mod JAR) containing a logo for display
logoFile= "modlogo.png"

# A text field displayed in the mod UI
credits="Thanks to 'NoTuing_Steve', 'hiczp', 'keqing' and other contributors!" #optional

# The authors of the mod, displayed in the mod UI.
authors="Team Astralisium" #optional

# The description text for the mod (multi line!) (#mandatory)
description='''
This mod added a bunch of cute foods, teas, various decorations and fantastic furnitures, which is fulfilled with KAWAII, allowing you to enjoy a vibrant day in Minecraft!

The majority of contents added by this mod is from the game 'Kemono Teatime'.
PLEASE NOTE: Studio Lalala and FURYU Corporation haven't support, advertise or take part in the development of this mod in any form, and this mod is not an official product of them. This mod is a fan-made project, and all the contents are created by the mod author and contributors.

All disturbtions, convergences and recreations of this mod must follow GNU AGPLv3 License.
'''

# The [[mixins]] block allows you to declare your mixin config to FML so that it gets loaded.
[[mixins]]
config="${mod_id}.mixins.json"

# The [[accessTransformers]] block allows you to declare where your AT file is.
# If this block is omitted, a fallback attempt will be made to load an AT from META-INF/accesstransformer.cfg
#[[accessTransformers]]
#file="META-INF/accesstransformer.cfg"
# The coremods config file path is not configurable and is always loaded from META-INF/coremods.json

# Do not include any major updated minecraft versions in dependencies
[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},999.999.999.999)"
    ordering="NONE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="vital_herbs"
    type="optional"
    versionRange="[7.0.1,)"
    ordering="AFTER"
    side="BOTH"

# Features are specific properties of the game environment, that you may want to declare you require. This example declares
# that your mod requires GL version 3.2 or higher. Other features will be added. They are side aware so declaring this won't
# stop your mod loading on the server for example.
#[features.${mod_id}]
#openGLVersion="[3.2,)"
